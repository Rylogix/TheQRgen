<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>100% Free and no data saved</h1>
      <div class="controls">
        <input id="qr-input" type="text" autocomplete="off" placeholder=" Type anything here.." aria-label="QR content" />
        <button id="generate-btn" type="button">Generate</button>
      </div>
      <section id="qr-section" class="qr-section" hidden>
        <div class="qr-output">
          <div class="color-control">
            <span class="color-label">change the color</span>
            <input id="color-picker" type="color" value="#ffffff" aria-label="QR background color" />
          </div>
          <canvas id="qr-canvas" width="1200" height="1200" aria-label="Generated QR code"></canvas>
        </div>
        <div class="qr-actions">
          <button id="download-btn" type="button">Download</button>
        </div>
      </section>
    </main>
    <script src="lib/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
