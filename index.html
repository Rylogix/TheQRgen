<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="mode-toggle" role="group" aria-label="Select code type">
        <button class="mode-btn is-active" type="button" data-mode="qr" aria-pressed="true">
          QR Code
        </button>
        <button class="mode-btn" type="button" data-mode="barcode" aria-pressed="false">
          Barcode
        </button>
      </div>
      <h1>100% Free and no data saved</h1>
      <div class="controls">
        <input id="qr-input" type="text" autocomplete="off" placeholder=" Type anything here.." aria-label="QR content" />
        <button id="generate-btn" type="button">Generate</button>
      </div>
      <p id="output-status" class="output-status" aria-live="polite" hidden></p>
      <section id="qr-section" class="qr-section" hidden>
        <div class="qr-output">
          <div class="side-controls">
            <div class="color-control">
              <span class="color-label">change the color</span>
              <input id="color-picker" type="color" value="#ffffff" aria-label="QR background color" />
            </div>
          </div>
          <canvas id="qr-canvas" width="1200" height="1200" aria-label="Generated QR code"></canvas>
          <div class="logo-control">
            <div class="logo-row">
              <span class="color-label">center image</span>
              <input id="logo-input" type="file" accept="image/*" aria-label="Upload center image" />
              <button id="logo-remove-btn" type="button">Remove</button>
            </div>
            <span id="logo-status" class="logo-status" aria-live="polite"></span>
          </div>
        </div>
        <div class="qr-actions">
          <button id="download-btn" type="button">Download</button>
        </div>
      </section>
    </main>
    <script src="lib/qrcode.min.js"></script>
    <script src="lib/JsBarcode.all.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
